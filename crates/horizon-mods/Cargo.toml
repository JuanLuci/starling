[package]
name = "horizon-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "Horizon's mod runtime: sandboxed WebAssembly components (docs/mods.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
# The 36 LTS line: security fixes until August 2027, and it builds on the client's Rust.
wasmtime = { version = "36.0.18", default-features = false, features = ["runtime", "cranelift", "component-model", "std"], optional = true }
# Names a mod's compiled code in the cache by its WebAssembly.
sha2 = { version = "0.10.9", optional = true }
# Unpacks the shared JavaScript engine the build embeds (build.rs).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"], optional = true }
# Turns a mod's core module into a component (cargo horizon-mod build, the tests).
wit-component = { version = "0.239", optional = true }
wit-parser = { version = "0.239", optional = true }

[features]
default = ["runtime"]
# Loads and runs mods; without it only manifests and packaging (cargo horizon-mod).
runtime = ["dep:wasmtime", "dep:sha2", "dep:flate2"]
pack = ["dep:wit-component", "dep:wit-parser"]

[build-dependencies]
# build.rs packs the shared JavaScript engine and names it by its digest.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
sha2 = "0.10.9"

[dev-dependencies]
horizon-mods = { path = ".", features = ["pack"] }

[lints]
workspace = true
