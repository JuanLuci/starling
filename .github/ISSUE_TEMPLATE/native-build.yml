name: Native mod build
description: Build Starling's game with a set of native mods (the game's Native mods page fills this in)
title: "[native build] "
body:
  - type: markdown
    attributes:
      value: |
        Submit as it is: the build starts by itself (about 15 minutes), and the game's **Native mods** page finds it.
        Only the mods in the repository's `native-mods/` folder build.
  - type: input
    id: version
    attributes:
      label: Starling version
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Mods
      description: Mod ids, separated by spaces
      placeholder: wrench
    validations:
      required: true
