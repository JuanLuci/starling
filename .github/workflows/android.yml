name: android
# The Starling APK, on GitHub's runners: every push to the android branch and every pull request builds it and keeps
# it as an artifact, signed with the debug key in STARLING_DEBUG_KEYSTORE_BASE64 so one installs over another (a
# throwaway key where that secret is missing, as in a fork's pull request). A tag v* signs it with the release key held
# in the repository's secrets (STARLING_KEYSTORE_BASE64, STARLING_KEY_ALIAS, STARLING_STORE_PASSWORD, STARLING_KEY_PASSWORD)
# and publishes it as a pre-release. The APK holds no game files: players prepare those from their own copy.
on:
  push:
    branches: [android]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      keep_symbols:
        description: Ship the library unstripped, for a profiler (simpleperf) to name its functions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # javac for the activities, and d8 and apksigner from the build-tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/android' }}
      - name: Unpack the release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.STARLING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "STARLING_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/starling-release.jks"
          echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/starling-release.jks" >> "$GITHUB_ENV"
      # Where build_apk.py keeps its debug key (alias horizon-debug, password android).
      - name: Unpack the debug key
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE: ${{ secrets.STARLING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || exit 0
          mkdir -p target/android
          echo "$KEYSTORE" | base64 -d > target/android/debug.keystore
      - name: Build the APK
        env:
          HORIZON_ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.STARLING_KEY_ALIAS || 'horizon-debug' }}
          HORIZON_ANDROID_STORE_PASSWORD: ${{ secrets.STARLING_STORE_PASSWORD }}
          HORIZON_ANDROID_KEY_PASSWORD: ${{ secrets.STARLING_KEY_PASSWORD }}
        # Releases with the fast profile (fewer codegen units: a little quicker in game).
        run: python packaging/android/build_apk.py ${{ startsWith(github.ref, 'refs/tags/v') && '--profile fast' || '' }} ${{ inputs.keep_symbols && '--keep-symbols' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: starling-apk
          path: target/android/starling-*.apk
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/android/starling-*.apk \
            --title "Starling $GITHUB_REF_NAME" --generate-notes --prerelease
